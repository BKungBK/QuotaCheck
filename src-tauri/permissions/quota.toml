[default]
description = "Default permissions for the quota plugin"
permissions = [
    "allow-save-refresh-token",
    "allow-save-config",
    "allow-get-quota-cache",
    "allow-trigger-manual-sync",
    "allow-check-notification-permission",
    "allow-request-notification-permission",
    "allow-open-notification-settings",
    "allow-trigger-test-notification"
]

[[permission]]
identifier = "allow-save-refresh-token"
description = "Enables saveRefreshToken command"
commands.allow = ["saveRefreshToken"]

[[permission]]
identifier = "allow-save-config"
description = "Enables saveConfig command"
commands.allow = ["saveConfig"]

[[permission]]
identifier = "allow-get-quota-cache"
description = "Enables getQuotaCache command"
commands.allow = ["getQuotaCache"]

[[permission]]
identifier = "allow-trigger-manual-sync"
description = "Enables triggerManualSync command"
commands.allow = ["triggerManualSync"]

[[permission]]
identifier = "allow-check-notification-permission"
description = "Enables checkNotificationPermission command"
commands.allow = ["checkNotificationPermission"]

[[permission]]
identifier = "allow-request-notification-permission"
description = "Enables requestNotificationPermission command"
commands.allow = ["requestNotificationPermission"]

[[permission]]
identifier = "allow-open-notification-settings"
description = "Enables openNotificationSettings command"
commands.allow = ["openNotificationSettings"]

[[permission]]
identifier = "allow-trigger-test-notification"
description = "Enables triggerTestNotification command"
commands.allow = ["triggerTestNotification"]
